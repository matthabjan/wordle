services:
  wordle:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_GAME_NAME: ${VITE_GAME_NAME:-Wordle}
        VITE_GAME_DESCRIPTION: ${VITE_GAME_DESCRIPTION:-Wordle auf Deutsch}
    image: wordle:prod
    container_name: wordle-app
    restart: unless-stopped
    # Local testing — publishes host port. For Traefik/Portainer, do not publish 8080;
    # attach the container to your Traefik network and set Traefik labels in that stack.
    ports:
      - "${WORDLE_PORT:-8080}:8080"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - wordle-network

  # Optional legacy SSL proxy — prefer Traefik/Portainer for public HTTPS.
  # nginx-proxy:
  #   image: nginx:1.28-alpine
  #   ...

networks:
  wordle-network:
    driver: bridge
