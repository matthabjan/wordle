server {
    # Non-root cannot bind < 1024; Traefik proxies to this port on the Docker network.
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    server_tokens off;
    root   /usr/share/nginx/html;
    index  index.html;

    # Docker embedded DNS — resolved per-request (not at startup) so the app still
    # serves the game even if leaderboard-api isn't deployed on this network.
    resolver 127.0.0.11 valid=10s;

    # Defense-in-depth headers (HSTS is set by Traefik after TLS termination).
    # style-src 'unsafe-inline' is required by React / Framer Motion / Tailwind inline styles.
    include /etc/nginx/snippets/security-headers.conf;

    # Hashed Vite assets — long cache
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Self-hosted fonts
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # HTML / SW / manifest must revalidate so updates are not sticky
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Content-Type "application/javascript; charset=utf-8";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* ^/manifest(\.webmanifest|\.json)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Leaderboard — proxied same-origin to avoid CORS. Uses a variable so nginx
    # resolves "leaderboard-api" at request time via the resolver above; if the container
    # is absent or down, this 502s and the frontend fails silently (core game is unaffected).
    # No URI on proxy_pass: with a variable, a path suffix would replace the whole request
    # URI (e.g. /api/leaderboard → /api/) and break routing. Client and server both use /api/*.
    location /api/ {
        set $leaderboard_upstream http://leaderboard-api:3001;
        proxy_pass $leaderboard_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
