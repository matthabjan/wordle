name: Docker

# Builds and publishes both images to Docker Hub.
#   push to development → :dev
#   push to main        → :edge
#   push tag vX.Y.Z     → :X.Y.Z, :X.Y, :X, :latest (+ GitHub Release)
#   pull request        → build only, nothing pushed
#
# Requires repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (Docker Hub access token with Read & Write scope).
on:
  push:
    branches:
      - main
      - development
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAMESPACE: matthabjan

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Server tests
        working-directory: server
        run: npm ci && npm test

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wordle
            context: .
            target: prod
          - name: wordle-leaderboard-api
            context: ./server
            target: prod
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/development' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=pr

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_GAME_NAME=${{ vars.VITE_GAME_NAME || 'Wordle' }}
            VITE_GAME_DESCRIPTION=${{ vars.VITE_GAME_DESCRIPTION || 'Wordle auf Deutsch' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  hub-description:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: wordle
            short: German Wordle PWA (nginx, port 8080)
          - name: wordle-leaderboard-api
            short: Optional leaderboard API for matthabjan/wordle (port 3001)
    steps:
      - uses: actions/checkout@v7
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
          short-description: ${{ matrix.short }}
          readme-filepath: ./README.md
          enable-url-completion: true
