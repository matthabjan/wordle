name: Test
on:
  pull_request:
  push:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Server version matches app version
        run: |
          app="$(node -p "require('./package.json').version")"
          srv="$(node -p "require('./server/package.json').version")"
          if [ "$app" != "$srv" ]; then
            echo "::error::server/package.json ($srv) must match package.json ($app)"
            exit 1
          fi
      - run: npm test

  server-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
