version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    ignore:
      # Majors (React 19, Vite, Vitest, TypeScript …) are upgraded deliberately.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /server
    target-branch: development
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      server-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /server]
    target-branch: development
    schedule:
      interval: weekly
    ignore:
      # node / nginx major bumps are upgraded deliberately.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
